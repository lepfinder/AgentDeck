[package]
name = "agentdeck"
version = "0.2.6"
description = "AgentDeck - AI Coding Cockpit"
authors = ["AgentDeck Team"]
license = "MIT"
repository = "https://github.com/lepfinder/AgentDeck"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agentdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
walkdir = "2.4"
regex = "1.10"
parking_lot = "0.12"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2.5"
urlencoding = "2.1"
flate2 = "1.0"
tar = "0.4"
rfd = "0.15"

